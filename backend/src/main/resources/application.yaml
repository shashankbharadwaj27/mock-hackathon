spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://localhost:3306/retail
    username : root
    password : root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

jwt:
  secret: my-super-long-random-secret-key-which-should-be-at-least-32-bytes
  expiration: 86400000  # 1 day in milliseconds

logging:
  level:
    root: INFO
    com.example.backend: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG